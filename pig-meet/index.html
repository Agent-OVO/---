<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7a7b8">
<title>小猪见面会</title>
<style>
html,body{margin:0;min-height:100%;background:#fff5f7;color:#7a3340;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
#status{padding:32px 18px;text-align:center;font-size:16px}
#poster{display:block;width:100%;max-width:720px;height:auto;margin:0 auto;image-rendering:auto}
</style>
</head>
<body>
<main>
  <div id="status">海报加载中…</div>
  <img id="poster" alt="小猪见面会海报" hidden>
</main>
<script>
(()=>{
  const status=document.getElementById('status');
  const img=document.getElementById('poster');
  try{
    let s=location.hash.slice(1);
    if(!s) throw new Error('missing poster data');
    s=s.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4) s+='=';
    img.onload=()=>{status.remove();img.hidden=false;};
    img.onerror=()=>{status.textContent='海报加载失败，请重新扫码。';};
    img.src='data:image/jpeg;base64,'+s;
  }catch(e){
    status.textContent='请使用活动二维码打开本页。';
  }
})();
</script>
</body>
</html>
