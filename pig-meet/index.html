<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7a7b8">
<title>小猪见面会</title>
<style>
html,body{margin:0;min-height:100%;background:#fff5f7;color:#7a3340;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
#status{padding:32px 18px;text-align:center;font-size:16px}
#poster{display:block;width:100%;max-width:720px;height:auto;margin:0 auto}
</style>
</head>
<body>
<main>
  <div id="status">海报加载中…</div>
  <img id="poster" alt="小猪见面会海报" hidden>
</main>
<script>
(async()=>{
  const files=Array.from({length:9},(_,i)=>`data/p${i}.txt`);
  const status=document.getElementById('status');
  try{
    const parts=await Promise.all(files.map(async u=>{
      const r=await fetch(u,{cache:'force-cache'});
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      return (await r.text()).trim();
    }));
    const img=document.getElementById('poster');
    img.onload=()=>{status.remove();img.hidden=false;};
    img.onerror=()=>{status.textContent='海报加载失败，请刷新重试。';};
    img.src='data:image/jpeg;base64,'+parts.join('');
  }catch(e){
    status.textContent='海报加载失败，请刷新重试。';
  }
})();
</script>
</body>
</html>
